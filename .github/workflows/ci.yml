name: CI

on:
  push:
  pull_request:
  # release.yml starts these gates before a release
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The whole history, so that check:conventions reads each commit of a pull request
          fetch-depth: 0
      # The pnpm version comes from "packageManager" in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The conventions of the repositories of mark1russell7 (@mark1russell7/conventions)
      - run: pnpm check:conventions
      - run: pnpm test
      - run: pnpm build
      # dist/ is committed, so that a git dependency needs no build at install
      - name: dist/ agrees with src/
        run: git diff --exit-code --stat -- dist && test -z "$(git status --porcelain -- dist)"
      # The writing rules (ASD-STE100) of the README and the doc comments
      - run: pnpm lint:ste
      # The site bundles the core of the package. A change that breaks the bundle stops the pull request, not the deploy.
      - run: pnpm --filter @ste-lint/site run build

  # The one check of the ruleset of main (CI.md of mark1russell7/template, "The check of the ruleset").
  # It passes only when each job of needs passed, or was skipped by its own if and ALLOW_SKIP names it.
  # A new job of this file goes in needs, so the ruleset never has to change, and gh pr merge --auto
  # waits for the whole gate.
  ci-ok:
    name: CI OK
    if: always()
    needs: [ci]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    permissions: {}
    steps:
      - name: Each job passed
        env:
          NEEDS: ${{ toJSON(needs) }}
          # The jobs that their own if may skip, separated by spaces. Each other job must pass.
          ALLOW_SKIP: ""
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key) \(.value.result)"' > results
          cat results
          if [ ! -s results ]; then echo "::error::no job in needs"; exit 1; fi
          bad=0
          while read -r job result; do
            case "$result" in
              success) ;;
              skipped) case " $ALLOW_SKIP " in *" $job "*) ;; *) echo "::error::$job was skipped, and ALLOW_SKIP does not name it"; bad=1 ;; esac ;;
              *) echo "::error::$job: $result"; bad=1 ;;
            esac
          done < results
          exit $bad
